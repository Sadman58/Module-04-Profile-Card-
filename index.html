<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Cards</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Me my friends Profile Card</h1>

<div class="card-container">

    <div class="card">
        <span class="badge">ONLINE</span>

        <img src="image/sadman.jpeg" alt="Profile">

        <div class="card-content">
            <h2>MD. Azmain Faysal Sadman Patwary</h2>
            <p>CSE Student</p>
            <p>I love programming and web development.</p>
            <button onclick="viewProfile()">View Profile</button>
        </div>
    </div>


    <div class="card">
        <span class="badge new">NEW</span>

        <img src="image/aonkon.jpeg" alt="Profile">

        <div class="card-content">
            <h2>Aonkon Kanti Dey</h2>
            <p>CSE Student</p>
            <p>Interested in software development and AI</p>
            <button onclick="viewProfile()">View Profile</button>
        </div>
    </div>


    <div class="card">
        <span class="badge">ONLINE</span>

        <img src="image/mehraj.jpeg" alt="Profile">

        <div class="card-content">
            <h2>Mehraj Hossien</h2>
            <p>CSE Student</p>
            <p>I enjoy designing websites and learning CSS</p>
            <button onclick="viewProfile()">View Profile</button>
        </div>
    </div>

</div>


<script>
function viewProfile() {
    console.log("View Profile button clicked");
}
</script>

</body>
</html>
